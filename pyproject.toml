[project]
name = "fwo-models"
version = "0.1.0"
description = "Experiments of forcasting and recommender models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lightning>=2.4.0",
    "pickleshare>=0.7.5",
    "polars>=1.15.0",
    "rich>=13.9.4",
    "scikit-learn>=1.5.2",
    "torch>=2.5.1",
    "torchmetrics>=1.6.0",
    "u8darts[notorch]>=0.31.0",
    "xgboost>=2.1.3",
    "joblib>=1.4.2",
    "wandb>=0.18.7",
    "transformers>=4.46.3",
    "datasets>=3.1.0",
    "pyarrow>=18.1.0",
    "einops>=0.8.0",
    "loguru>=0.7.3",
    "pyyaml>=6.0.2",
    "networkx>=3.4.2",
    "nbconvert>=7.16.6",
]

[dependency-groups]
dev = [
    "xlsxwriter>=3.2.0",
    "tensorboard>=2.18.0",
    "seaborn>=0.13.2",
    "ruff>=0.8.0",
    "fastexcel>=0.12.0",
    "ipykernel>=6.29.5",
    "openpyxl>=3.1.5",
    "ipython>=8.29.0",
    "ipywidgets>=8.1.5",
    "torch-tb-profiler>=0.4.3",
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
    "ipywidgets>=8.1.5",
    "matplotlib>=3.10.0",
    "jupyterlab>=4.3.5",
    "notebook>=7.3.2",
]

[tool.ruff]
# Allow lines to be as long as 120.
line-length = 120
